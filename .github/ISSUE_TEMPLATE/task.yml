name: Task
description: Planned work toward a roadmap milestone.
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        A task is one piece of work from [the roadmap](https://github.com/augustogiavedoni/lore/blob/main/docs/roadmap.md).
        Assign it to its milestone (M0–M6) and to one `area:` label.
  - type: input
    id: criterion
    attributes:
      label: Roadmap criterion
      description: The acceptance criterion this task moves forward, as written in docs/roadmap.md.
      placeholder: "M0: An automated check validates the corpus and the dataset."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: What changes, and why it is needed.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable conditions, ideally proved by tests or the eval set.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: >-
        Does this touch the threat model (role filtering in retrieval,
        untrusted document content, secrets, data sent to providers, MCP
        tools)? Write "none" if not.
    validations:
      required: true
